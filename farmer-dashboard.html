
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة المزارع</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f4f7f6; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        
        
       
    </style>
</head>
<body>

    <header>
        <div class="container header-inner">
            <h2 style="color: #2e7d32;">سوق المزرعة</h2>
            <button onclick="window.location.href='index.html'" style="padding: 8px 15px; cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 5px;">← العودة للرئيسية</button>
        </div>
    </header>

    <div class="container">
        <div class="profile-area">
            <div class="avatar" id="profileAvatar">م</div>
            <div class="farmer-name" id="profileName">اسم المزارع</div>
            <p style="color: #666; font-size: 14px;">حساب مزارع معتمد</p>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card"><h3 id="countFarms">0</h3><p>مزارعي</p></div>
            <div class="stat-card"><h3 id="countCrops">0</h3><p>محاصيلي بالأسواق</p></div>
        </div>

        <!-- قسم المزارع -->
        <div class="section-header">
            <h2>مزارعي</h2>
            <button class="btn-add" onclick="document.getElementById('farmModal').style.display='flex'">+ إضافة مزرعة</button>
        </div>
        <div class="grid-cards" id="farmsGrid"></div>

        <!-- قسم المحاصيل -->
        <div class="section-header">
            <h2>محاصيلي المعروضة للبيع</h2>
            <button class="btn-add" onclick="document.getElementById('cropModal').style.display='flex'">+ إضافة محصول للسوق</button>
        </div>
        <div class="grid-cards" id="cropsGrid"></div>
    </div>

    <!-- نافذة إضافة مزرعة -->
    <div class="modal" id="farmModal">
        <div class="modal-box">
            <button onclick="this.parentElement.parentElement.style.display='none'" style="position:absolute; top:10px; right:10px; background:none; border:none; color:red; font-size:20px; cursor:pointer;">✖</button>
            <h3 style="color:#2e7d32; margin-bottom:15px;">إضافة مزرعة جديدة</h3>
            <input type="text" id="farmName" placeholder="اسم المزرعة (مثال: مزرعة الأمل)">
            <input type="text" id="farmLocation" placeholder="الموقع (مثال: الشرقية - فاقوس)">
            <button class="btn-add" style="width:100%;" onclick="saveFarm()">حفظ المزرعة</button>
        </div>
    </div>

    <!-- نافذة إضافة محصول للسوق -->
    <div class="modal" id="cropModal">
        <div class="modal-box">
            <button onclick="this.parentElement.parentElement.style.display='none'" style="position:absolute; top:10px; right:10px; background:none; border:none; color:red; font-size:20px; cursor:pointer;">✖</button>
            <h3 style="color:#2e7d32; margin-bottom:15px;">إضافة محصول وعرضه بالسوق</h3>
            <input type="text" id="cropName" placeholder="اسم المحصول (مثال: عنب أحمر)">
            <input type="number" id="cropPrice" placeholder="السعر بالجنيه (مثال: 40)">
            <select id="cropCategory">
                <option value="خضروات">خضروات</option>
                <option value="فاكهة">فاكهة</option>
                <option value="حبوب">حبوب</option>
            </select>
            <input type="text" id="cropImg" placeholder="رابط صورة المحصول (اختياري)">
            <button class="btn-add" style="width:100%;" onclick="saveCrop()">نشر في السوق</button>
        </div>
    </div>

    



















    <script src="js/boot.js?v=20250603c"></script>
    <script src="js/config.js?v=20250603c"></script>
    <script src="js/api.js?v=20250603c"></script>
    <script src="js/auth.js?v=20250603c"></script>
    <script src="js/farmer-dashboard.js?v=20250603c"></script>

   
</body>
</html>
