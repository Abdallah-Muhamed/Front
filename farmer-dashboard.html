
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title> صفحة المزارع</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f4f7f6; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        
        
       
    </style>
</head>
<body>

    <header>
        <div class="container header-inner">
        <div class="brand__icon"><a href="index.html"><img src="images/logo.png" alt="Logo" width="220" height="80" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<h2 style=\'color:#2f7d32;\'>سوق المزرعة</h2>');"></a></div>
            <button onclick="window.location.href='index.html'" style="padding:8px 15px; cursor:pointer; border:1px solid #ccc; background:white; border-radius:5px;display: inline-block; float: left;">>← العودة للرئيسية</button>
        </div>
    </header>

    <div class="container">
        <div class="profile-area">
            <div class="avatar" id="profileAvatar">م</div>
            <div class="farmer-name" id="profileName">اسم المزارع</div>
            <p style="color: #666; font-size: 14px;">حساب مزارع معتمد</p>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card"><h3 id="countFarms">0</h3><p>مزارعي</p></div>
            <div class="stat-card"><h3 id="countCrops">0</h3><p>محاصيلي بالأسواق</p></div>
        </div>

        <!-- قسم المزارع -->
        <div class="section-header">
            <h2>مزارعي</h2>
            <button class="btn-add" onclick="openFarmModal()">+ إضافة مزرعة</button>
        </div>
        <div class="grid-cards" id="farmsGrid"></div>

        <!-- قسم المحاصيل -->
        <div class="section-header">
            <h2>محاصيلي المعروضة للبيع</h2>
            <button class="btn-add" onclick="openCropModal()">+ إضافة محصول للسوق</button>
        </div>
        <div class="grid-cards" id="cropsGrid"></div>
    </div>

    <!-- نافذة إضافة مزرعة -->
   <div class="sf-modal" id="farmModal">
  <div class="sf-modal__box">
    <div class="sf-modal__header">
      <h3 id="farmModalTitle">إضافة مزرعة جديدة</h3>
      <button type="button" class="sf-icon-btn" onclick="closeFarmModal()">✖</button>
    </div>

    <div class="sf-modal__body">
      <div class="sf-form">
        <div class="sf-field">
          <label for="farmName">اسم المزرعة</label>
          <input type="text" id="farmName" placeholder="مثال: مزرعة الأمل" required>
        </div>

        <div class="sf-field">
          <label for="farmLocation">الموقع</label>
          <input type="text" id="farmLocation" placeholder="مثال: الشرقية - فاقوس" required>
        </div>

        <div class="sf-field">
          <label for="farmArea">المساحة (فدان)</label>
          <input type="number" id="farmArea" placeholder="مثال: 2.5" step="0.01" min="0" required>
          <small class="sf-hint">اكتب رقم صحيح (مثال: 1.25)</small>
        </div>
      </div>
    </div>

    <div class="sf-modal__footer">
      <button type="button" class="sf-btn sf-btn--ghost" onclick="closeFarmModal()">إلغاء</button>
      <button type="button" class="sf-btn sf-btn--primary" onclick="saveFarm()">حفظ المزرعة</button>
    </div>
  </div>
</div>

    <!-- نافذة إضافة محصول للسوق -->
  <div class="sf-modal" id="cropModal">
  <div class="sf-modal__box">
    <div class="sf-modal__header">
      <h3 id="cropModalTitle">إضافة محصول وعرضه بالسوق</h3>
      <button type="button" class="sf-icon-btn" onclick="closeCropModal()">✖</button>
    </div>

    <div class="sf-modal__body">
      <div class="sf-form sf-form--grid">
        <div class="sf-field">
          <label for="cropName">اسم المحصول</label>
          <input type="text" id="cropName" placeholder="مثال: عنب أحمر" required>
        </div>

        <div class="sf-field">
          <label for="cropCategory">النوع</label>
          <select id="cropCategory" required>
            <option value="خضروات">خضروات</option>
            <option value="فاكهة">فاكهة</option>
            <option value="حبوب">حبوب</option>
          </select>
        </div>

        <div class="sf-field">
          <label for="cropFarmId">المزرعة</label>
          <select id="cropFarmId" required>
            <option value="">اختر المزرعة</option>
          </select>
        </div>

        <div class="sf-field">
          <label for="cropPrice">السعر (جنيه)</label>
          <input type="number" id="cropPrice" placeholder="مثال: 40" min="1" step="1" required>
        </div>

        <div class="sf-field">
          <label for="cropQuantity">الكمية المتاحة</label>
          <input type="number" id="cropQuantity" placeholder="مثال: 100" min="1" step="1" required>
        </div>

        <div class="sf-field">
         <div class="sf-field">
  <label for="cropPhotoInput">صورة المحصول</label>
  <input type="file" id="cropPhotoInput" accept="image/*">
  <small class="sf-hint">PNG / JPG — حد أقصى 5MB</small>

  <div id="cropPhotoPreview" class="sf-img-preview" hidden></div>
</div>
        </div>
      </div>
    </div>

    <div class="sf-modal__footer">
      <button type="button" class="sf-btn sf-btn--ghost" onclick="closeCropModal()">إلغاء</button>
      <button type="button" class="sf-btn sf-btn--primary" onclick="saveCrop()">نشر في السوق</button>
    </div>
  </div>
</div>
    



















    <script src="js/boot.js?v=20250603c"></script>
    <script src="js/config.js?v=20250603c"></script>
    <script src="js/api.js?v=20250603c"></script>
    <script src="js/auth.js?v=20250603c"></script>
    <script src="js/farmer-dashboard.js?v=20250603c"></script>

   
</body>
</html>
