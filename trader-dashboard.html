<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>صفحة التاجر</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="container header-inner" style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="color:#2e7d32;margin:0;">لوحة التاجر</h2>
      <div style="display:flex;gap:8px;">
        <a href="products.html" class="btn btn--primary" style="text-decoration:none;">تسوق</a>
        <button type="button" onclick="window.location.href='index.html'" class="btn btn--ghost">← الرئيسية</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="profile-area">
      <div class="avatar" id="profileAvatar">ت</div>
      <div class="farmer-name" id="profileName">اسم التاجر</div>
      <p style="color:#666;font-size:14px;">حساب تاجر معتمد</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h3 id="countCrops">0</h3><p>منتجاتي بالسوق</p></div>
      <div class="stat-card"><h3 id="sumStock">0</h3><p>إجمالي الكميات</p></div>
    </div>

    <div class="section-header">
      <h2>منتجاتي المعروضة للبيع</h2>
      <button class="btn-add" onclick="openCropModal()">+ إضافة منتج للسوق</button>
    </div>
    <div class="grid-cards" id="cropsGrid"></div>

    <div class="section-header" style="margin-top:25px;">
      <h2>طلباتي</h2>
    </div>
    <div class="grid-cards" id="ordersGrid"></div>
    <p id="ordersEmpty" style="color:#888;margin-top:10px;" hidden>لا توجد طلبات حتى الآن.</p>
  </div>

  <div class="sf-modal" id="cropModal">
    <div class="sf-modal__box">
      <div class="sf-modal__header">
        <h3>إضافة منتج للسوق</h3>
        <button type="button" class="sf-icon-btn" onclick="closeCropModal()">✖</button>
      </div>
      <div class="sf-modal__body">
        <div class="sf-form sf-form--grid">
          <div class="sf-field">
            <label for="cropName">اسم المنتج</label>
            <input type="text" id="cropName" placeholder="مثال: عنب أحمر" required>
          </div>
          <div class="sf-field">
            <label for="cropCategory">النوع</label>
            <select id="cropCategory" required>
              <option value="خضروات">خضروات</option>
              <option value="فاكهة">فاكهة</option>
              <option value="حبوب">حبوب</option>
            </select>
          </div>
          <div class="sf-field">
            <label for="cropPrice">السعر (جنيه)</label>
            <input type="number" id="cropPrice" min="1" step="1" required>
          </div>
          <div class="sf-field">
            <label for="cropQuantity">الكمية</label>
            <input type="number" id="cropQuantity" min="1" step="1" required>
          </div>
          <div class="sf-field" style="grid-column:1/-1;">
            <label for="cropPhotoInput">صورة المنتج</label>
            <input type="file" id="cropPhotoInput" accept="image/*">
            <div id="cropPhotoPreview" class="sf-img-preview" hidden></div>
          </div>
        </div>
      </div>
      <div class="sf-modal__footer">
        <button type="button" class="sf-btn sf-btn--ghost" onclick="closeCropModal()">إلغاء</button>
        <button type="button" class="sf-btn sf-btn--primary" onclick="saveCrop()">نشر في السوق</button>
      </div>
    </div>
  </div>

  <div class="sf-modal" id="confirmModal">
    <div class="sf-modal__box" style="width:min(520px,100%);">
      <div class="sf-modal__header">
        <h3 id="confirmTitle">تأكيد العملية</h3>
        <button type="button" class="sf-icon-btn" onclick="closeConfirm()">✖</button>
      </div>
      <div class="sf-modal__body">
        <p id="confirmMessage" style="margin:0;color:#374151;line-height:1.7;">هل أنت متأكد؟</p>
      </div>
      <div class="sf-modal__footer">
        <button type="button" class="sf-btn sf-btn--ghost" onclick="closeConfirm()">إلغاء</button>
        <button type="button" class="sf-btn" id="confirmOkBtn" style="background:#b91c1c;color:#fff;">حذف</button>
      </div>
    </div>
  </div>

  <script src="js/boot.js?v=20250608"></script>
  <script src="js/config.js?v=20250608"></script>
  <script src="js/api.js?v=20250608"></script>
  <script src="js/auth.js?v=20250608"></script>
  <script src="js/trader-dashboard.js?v=20250615"></script>
</body>
</html>
